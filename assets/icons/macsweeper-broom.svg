<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0a40"/>
      <stop offset="55%" stop-color="#2e1269"/>
      <stop offset="100%" stop-color="#0e0520"/>
    </linearGradient>

    <!-- Handle gradient -->
    <linearGradient id="handle-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede9ff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <!-- Head gradient -->
    <linearGradient id="head-g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Sweep arc gradient -->
    <linearGradient id="arc-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>

    <!-- Inner glow -->
    <radialGradient id="inner-glow" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>

    <!-- Top sheen -->
    <radialGradient id="sheen" cx="40%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop shadow for broom -->
    <filter id="broom-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#000" flood-opacity="0.55"/>
    </filter>

    <!-- Soft glow for particles -->
    <filter id="particle-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── Background ── -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="220" fill="url(#inner-glow)"/>
  <rect width="1024" height="1024" rx="220" fill="url(#sheen)"/>

  <!-- ── Sweep arc (ghost trail behind broom) ── -->
  <!-- Large translucent arc suggesting the sweep motion -->
  <path d="M 180 820 A 460 460 0 0 1 820 180"
        fill="none"
        stroke="url(#arc-g)"
        stroke-width="90"
        stroke-linecap="round"
        opacity="0.5"/>

  <!-- ── Broom group — angled ~-45° ── -->
  <!-- Handle: from top-right (720,160) toward center-bottom (380,680) -->
  <g filter="url(#broom-shadow)">

    <!-- Handle stick -->
    <line x1="720" y1="160" x2="410" y2="660"
          stroke="url(#handle-g)" stroke-width="46" stroke-linecap="round"/>

    <!-- Handle end cap (top) -->
    <circle cx="720" cy="160" r="26" fill="#d8b4fe"/>

    <!-- Broom head body — perpendicular to handle at bottom -->
    <!-- Handle direction ≈ (-310, 500); perp ≈ (500, 310) normalized × 175 → (±155, ±96) -->
    <!-- Center of head: (410, 660) -->
    <!-- Left corner: (255, 564)  Right corner: (565, 756) -->
    <!-- Below-left: (240, 590)   Below-right: (548, 782) -->
    <path d="M252 558 L568 752 L554 790 L238 596 Z" fill="url(#head-g)"/>

    <!-- Bristle strands — splaying from the bottom edge -->
    <!-- Along the head base, 8 evenly spaced, bristles extend "down" (perp to handle, ~30px out) -->
    <line x1="244" y1="592" x2="222" y2="628" stroke="#c4b5fd" stroke-width="10" stroke-linecap="round"/>
    <line x1="284" y1="618" x2="264" y2="655" stroke="#a78bfa" stroke-width="10" stroke-linecap="round"/>
    <line x1="324" y1="644" x2="306" y2="682" stroke="#c4b5fd" stroke-width="10" stroke-linecap="round"/>
    <line x1="364" y1="670" x2="348" y2="709" stroke="#a78bfa" stroke-width="10" stroke-linecap="round"/>
    <line x1="404" y1="696" x2="390" y2="736" stroke="#c4b5fd" stroke-width="10" stroke-linecap="round"/>
    <line x1="444" y1="722" x2="432" y2="763" stroke="#a78bfa" stroke-width="10" stroke-linecap="round"/>
    <line x1="484" y1="748" x2="474" y2="790" stroke="#c4b5fd" stroke-width="10" stroke-linecap="round"/>
    <line x1="524" y1="774" x2="516" y2="816" stroke="#a78bfa" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- ── Scattered "junk" particles being swept away ── -->
  <g filter="url(#particle-glow)">
    <!-- Amber -->
    <rect x="630" y="700" width="34" height="34" rx="8" fill="#f59e0b" opacity="0.92"/>
    <!-- Red -->
    <rect x="700" y="650" width="24" height="24" rx="6" fill="#ef4444" opacity="0.85"/>
    <!-- Blue -->
    <circle cx="770" cy="710" r="18" fill="#60a5fa" opacity="0.88"/>
    <!-- Green -->
    <circle cx="680" cy="775" r="14" fill="#34d399" opacity="0.80"/>
    <!-- Pink -->
    <rect x="740" y="760" width="20" height="20" rx="5" fill="#f472b6" opacity="0.78"/>
    <!-- Purple -->
    <circle cx="610" cy="760" r="12" fill="#a78bfa" opacity="0.75"/>
    <!-- Orange small -->
    <circle cx="790" cy="660" r="10" fill="#fb923c" opacity="0.70"/>
    <!-- Cyan tiny -->
    <rect x="820" y="720" width="16" height="16" rx="4" fill="#22d3ee" opacity="0.65"/>
    <!-- Yellow tiny -->
    <circle cx="640" cy="840" r="9" fill="#fbbf24" opacity="0.60"/>
  </g>

  <!-- ── Sparkle crosses near bristles ── -->
  <g stroke-linecap="round" opacity="0.75">
    <line x1="598" y1="685" x2="618" y2="665" stroke="#fde68a" stroke-width="6"/>
    <line x1="618" y1="685" x2="598" y2="665" stroke="#fde68a" stroke-width="6"/>

    <line x1="765" y1="636" x2="781" y2="620" stroke="#bfdbfe" stroke-width="5"/>
    <line x1="781" y1="636" x2="765" y2="620" stroke="#bfdbfe" stroke-width="5"/>

    <line x1="665" y1="808" x2="679" y2="794" stroke="#ddd6fe" stroke-width="5"/>
    <line x1="679" y1="808" x2="665" y2="794" stroke="#ddd6fe" stroke-width="5"/>
  </g>

  <!-- ── Bottom edge inner shadow (depth) ── -->
  <rect width="1024" height="1024" rx="220"
        fill="none"
        stroke="rgba(0,0,0,0.35)"
        stroke-width="6"/>
</svg>
